name: Static Checks

on:
  pull_request:
    paths:
      - "terraform/**"
      - "packer/**"
      - ".github/workflows/static-checks.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "packer/**"

permissions:
  contents: read

jobs:
  terraform-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive -diff terraform

      - name: Terraform validate (modules/network)
        working-directory: terraform/modules/network
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform validate (environments/dev)
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        working-directory: terraform
        run: tflint --recursive

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 現状はトライアル段階で意図的にゆるい設定(パブリックサブネット、Flow Logs無し等)が
      # 残っているため soft_fail: true でレポートのみに留める。
      # 構成が固まってきたら false にしてブロッキングチェックへ昇格させる。
      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: true

  packer-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-packer@main
        with:
          version: "1.11.2"

      - name: Packer fmt check
        working-directory: packer
        run: packer fmt -check .

      - name: Packer validate
        working-directory: packer
        run: |
          packer init al2023-nginx.pkr.hcl
          packer validate al2023-nginx.pkr.hcl
