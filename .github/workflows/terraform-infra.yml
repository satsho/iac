name: Terraform Infra (dev)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply, or destroy"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: terraform/environments/dev
  TF_VAR_rhel_org_id: ${{ secrets.RHEL_ORG_ID }}
  TF_VAR_rhel_activation_key: ${{ secrets.RHEL_ACTIVATION_KEY }}
  TF_VAR_rhel_ami_id: ${{ vars.RHEL_AMI_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: AWS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Terraform Apply / Destroy
        if: ${{ inputs.action == 'apply' || inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
