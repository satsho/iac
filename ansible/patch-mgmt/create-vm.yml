---
- name: Set the paths and tags - {{ vm.name }}
  ansible.builtin.set_fact:
    vm_dir: "{{ libvirt_image_dir }}/{{ vm.name }}"
    # データディスクはVMのディレクトリの外に置き、VMを消しても残るようにする
    vm_data_disk: "{{ libvirt_image_dir }}/{{ vm.name }}-data.qcow2"
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

- name: Create the VM directories - {{ vm.name }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ vm_dir }}"
    - "{{ vm_dir }}/seed"
  become: true

- name: Create the root disk on top of the RHEL guest image - {{ vm.name }}
  ansible.builtin.command:
    argv: [qemu-img, create, -f, qcow2, -F, qcow2, -b, "{{ rhel_base_image }}", "{{ vm_dir }}/root.qcow2", 20G]
    creates: "{{ vm_dir }}/root.qcow2"
  become: true

- name: Create the mirror data disk - {{ vm.name }}
  ansible.builtin.command:
    argv: [qemu-img, create, -f, qcow2, "{{ vm_data_disk }}", "{{ vm.data_size_gb }}G"]
    creates: "{{ vm_data_disk }}"
  when: vm.data_size_gb is defined
  become: true

# 1台ごとに使い捨てのアクティベーション(登録は1回限り、既定で24時間で失効)を作る。
# アクティベーションに付けたタグは、登録したマネージドノード(mi-...)にそのまま付く。
- name: Create an SSM hybrid activation - {{ vm.name }}
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - create-activation
      - --region
      - "{{ aws_region }}"
      - --iam-role
      - "{{ ssm_hybrid_role }}"
      - --default-instance-name
      - "{{ vm.name }}"
      - --description
      - "patch-mgmt lab VM {{ vm.name }}"
      - --registration-limit
      - "1"
      - --tags
      - "{{ vm_tags | dict2items(key_name='Key', value_name='Value') | to_json }}"
      - --output
      - json
  register: activation_result
  changed_when: true
  no_log: true

- name: Keep the activation code - {{ vm.name }}
  ansible.builtin.set_fact:
    activation: "{{ activation_result.stdout | from_json }}"
  no_log: true

- name: Render the cloud-init seed files - {{ vm.name }}
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ vm_dir }}/seed/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: user-data/main.sh.j2, dest: user-data }
    - { src: meta-data.j2, dest: meta-data }
    - { src: network-config.j2, dest: network-config }
  no_log: true
  become: true

# NoCloudデータソース: ボリュームラベルが cidata のISOをcloud-initが読む
- name: Build the cloud-init seed ISO - {{ vm.name }}
  ansible.builtin.command:
    argv: [xorriso, -as, mkisofs, -output, "{{ vm_dir }}/seed.iso", -volid, cidata, -joliet, -rock, user-data, meta-data, network-config]
    chdir: "{{ vm_dir }}/seed"
  changed_when: true
  become: true

# user-data には activation key が平文で入るので、ISO以外には残さない
- name: Remove the rendered seed files - {{ vm.name }}
  ansible.builtin.file:
    path: "{{ vm_dir }}/seed"
    state: absent
  become: true

- name: Create and start the VM - {{ vm.name }}
  ansible.builtin.command:
    cmd: >-
      virt-install
      --name {{ vm.name }}
      --memory {{ vm.memory_mb }}
      --vcpus {{ vm.vcpus }}
      --cpu host-passthrough
      --os-variant {{ os_variant }}
      --import
      --disk path={{ vm_dir }}/root.qcow2,bus=virtio
      {% if vm.data_size_gb is defined %}--disk path={{ vm_data_disk }},bus=virtio,serial=mirror-data{% endif %}
      --disk path={{ vm_dir }}/seed.iso,device=cdrom
      {% for nic in vm.nics %}--network network={{ nic.network }},mac={{ nic.mac }},model=virtio {% endfor %}
      --graphics none
      --noautoconsole
  changed_when: true
  become: true

- name: Wait until the VM registers with Systems Manager - {{ vm.name }}
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - describe-instance-information
      - --region
      - "{{ aws_region }}"
      - --filters
      - "Key=ActivationIds,Values={{ activation.ActivationId }}"
      - --query
      - "InstanceInformationList[?PingStatus=='Online'] | length(@)"
      - --output
      - text
  register: ssm_node
  until: ssm_node.stdout | int > 0
  retries: 45
  delay: 20
  changed_when: false
