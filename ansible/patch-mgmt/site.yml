---
# 家のサーバ(KVMホスト)上で実行し、パッチ管理検証用のVMを作って設定する。
#   export AWS_PROFILE=<SSMのアクティベーションを作れるプロファイル>
#   ansible-playbook -k -K site.yml     # 初回(VMにはISOのユーザーのパスワードで入る)
#   ansible-playbook -K site.yml        # 2回目以降(初回に登録したSSH鍵で入る)
# 何度流してもよい。既にあるVMは作り直さず、設定だけを揃え直す。

- name: Create the lab VMs on the KVM host
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    # RHEL 10 は x86-64-v3 のCPUが必須(VMにはhost-passthroughでホストのCPU機能をそのまま見せる)
    x86_64_v3_flags: [avx, avx2, bmi1, bmi2, f16c, fma, abm, movbe, xsave]

  tasks:
    - name: Check that the required commands are installed
      ansible.builtin.command: "which {{ item }}"
      loop: [virsh, virt-install, qemu-img, virt-customize, nft, aws]
      changed_when: false

    - name: Read the host CPU flags
      ansible.builtin.command: grep -m1 ^flags /proc/cpuinfo
      register: cpu_flags
      changed_when: false

    - name: Check that the host CPU supports x86-64-v3
      ansible.builtin.assert:
        that:
          - x86_64_v3_flags | difference(cpu_flags.stdout.split()) | length == 0
        fail_msg: "RHEL 10 に必要なCPU機能が足りません: {{ x86_64_v3_flags | difference(cpu_flags.stdout.split()) }}"

    - name: Check that the golden image exists
      ansible.builtin.stat:
        path: "{{ golden_image_path }}"
      register: golden_image
      become: true

    - name: Fail when the golden image is missing
      ansible.builtin.assert:
        that:
          - golden_image.stat.exists
        fail_msg: >-
          {{ golden_image_path }} が無いので、先に packer/ でゴールデンイメージを
          作ってください(ansible/patch-mgmt/packer/README.md参照)。

    - name: Check whether any Windows VM is defined
      ansible.builtin.set_fact:
        has_windows_vms: "{{ vms | selectattr('os', 'defined') | selectattr('os', 'equalto', 'windows') | list | length > 0 }}"

    - name: Check that the Windows golden image exists
      ansible.builtin.stat:
        path: "{{ golden_image_path_windows }}"
      register: golden_image_windows
      become: true
      when: has_windows_vms

    - name: Fail when the Windows golden image is missing
      ansible.builtin.assert:
        that:
          - golden_image_windows.stat.exists
        fail_msg: >-
          {{ golden_image_path_windows }} が無いので、先に packer/ で
          `packer build windows2025-golden.pkr.hcl` を実行してゴールデンイメージを
          作ってください(ansible/patch-mgmt/packer/README.md参照)。
      when: has_windows_vms

    - name: Check that the SSH public key exists
      ansible.builtin.stat:
        path: "{{ ssh_public_key_file | expanduser }}"
      register: ssh_public_key

    - name: Fail when the SSH public key is missing
      ansible.builtin.assert:
        that:
          - ssh_public_key.stat.exists
        fail_msg: "{{ ssh_public_key_file }} が無いので、ssh-keygen で作るか vars.yml の ssh_public_key_file を直してください"

    # AWS CLI はこのplaybookを実行したユーザーの認証情報(AWS_PROFILE等)で動かし、become しない。
    # rootの /root/.aws/credentials は家のサーバ自身のHybrid Activationの一時クレデンシャルで、
    # アクティベーションを作る権限は無い(持たせるべきでもない)。
    - name: Show which AWS identity creates the activations
      ansible.builtin.command: aws sts get-caller-identity --query Arn --output text
      register: aws_identity
      changed_when: false

    - name: Print the AWS identity
      ansible.builtin.debug:
        msg: "SSMのアクティベーションは {{ aws_identity.stdout }} で作成します"

    - name: Create the image directory
      ansible.builtin.file:
        path: "{{ libvirt_image_dir }}"
        state: directory
        mode: "0711"
      become: true

    - name: Configure the scheduled start/stop of workload VMs
      ansible.builtin.include_tasks:
        file: tasks/vm-schedule.yml
        apply:
          become: true

    - name: Set up the egress firewall for the workload network
      ansible.builtin.include_tasks:
        file: tasks/kvm-firewall.yml
        apply:
          become: true
      when: libvirt_networks | selectattr('egress_firewall', 'defined') | selectattr('egress_firewall') | list | length > 0

    - name: Define and start the libvirt networks
      ansible.builtin.include_tasks:
        file: tasks/kvm-network.yml
        apply:
          become: true
      loop: "{{ libvirt_networks }}"
      loop_control:
        loop_var: net
        label: "{{ net.name }}"

    - name: Look up the existing VMs
      ansible.builtin.command: "virsh dominfo {{ item.name }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: existing_vms
      changed_when: false
      failed_when: false
      become: true

    - name: Pick the VMs that do not exist yet
      ansible.builtin.set_fact:
        new_vms: "{{ existing_vms.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    # インストールは全台同時に始め(virt-installはすぐ戻る)、終わったものから順に起動する。
    # OSごとにクローン方式が違う(RHEL: virt-customizeでnmconnectionを直接書き込み /
    # Windows: virt-customizeのfirstbootスクリプトでIP設定・リネームを初回起動時に実行)ので、
    # vm.osに応じてincludeするタスクファイルを切り替える。
    - name: Start the installations from the golden images
      ansible.builtin.include_tasks:
        file: "tasks/kvm-install{{ '-windows' if (vm.os | default('rhel')) == 'windows' else '' }}.yml"
        apply:
          become: true
      loop: "{{ new_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    - name: Attach the data disks and boot the installed VMs
      ansible.builtin.include_tasks:
        file: tasks/kvm-finish.yml
        apply:
          become: true
      loop: "{{ new_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    - name: Add the VMs to the inventory of this run
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: ["lab", "lab_{{ item.role }}"]
        ansible_host: "{{ (item.nics | first).address }}"
        ansible_user: "{{ vm_user_windows if (item.os | default('rhel')) == 'windows' else vm_user }}"
        # WindowsはOpenSSH Server経由でもPowerShellをシェルとして使う(golden-autounattend.xmlで
        # DefaultShellに設定済み)。ansible.builtin.raw/command/shellの実行形式がこれで変わる。
        ansible_shell_type: "{{ 'powershell' if (item.os | default('rhel')) == 'windows' else 'sh' }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ ssh_known_hosts_file }}"
        vm: "{{ item }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Wait until SSH is up on every RHEL VM
      ansible.builtin.wait_for:
        host: "{{ (item.nics | first).address }}"
        port: 22
        timeout: 900
      loop: "{{ vms | rejectattr('os', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # Windowsは初回起動後にfirstbootスクリプトがコンピュータ名変更のため再起動をかける
    # (kvm-install-windows.yml参照)。SSHが一瞬だけ応答してすぐ落ちる可能性があるため、
    # 多少待ってから確認を始め、タイムアウトも長めに取る。
    - name: Wait until SSH is up on every Windows VM
      ansible.builtin.wait_for:
        host: "{{ (item.nics | first).address }}"
        port: 22
        delay: 60
        timeout: 1800
      loop: "{{ vms | selectattr('os', 'defined') | selectattr('os', 'equalto', 'windows') | list }}"
      loop_control:
        label: "{{ item.name }}"

# infra のミラーが業務VMの前提なので、repository / infra を先に設定する
- name: Configure the repository and infra servers
  hosts: lab_repository:lab_infra
  become: true

  vars_files:
    - vars.yml

  vars:
    rhel_org_id: "{{ lookup('ansible.builtin.env', 'RHEL_ORG_ID') }}"
    rhel_activation_key: "{{ lookup('ansible.builtin.env', 'RHEL_ACTIVATION_KEY') }}"
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

  handlers:
    - name: Import the handlers
      ansible.builtin.import_tasks: handlers.yml

  tasks:
    - name: Configure the hostname, timezone and SSH
      ansible.builtin.import_tasks: tasks/common.yml

    - name: Register the VM with Systems Manager
      ansible.builtin.import_tasks: tasks/ssm-agent.yml

    - name: Set up the Red Hat CDN repositories
      ansible.builtin.import_tasks: tasks/rhsm-mirror.yml

    - name: Mount the mirror data disk
      ansible.builtin.import_tasks: tasks/mirror-disk.yml

    - name: Configure the role of the VM
      ansible.builtin.include_tasks: "tasks/{{ vm.role }}.yml"

- name: Configure the workload VMs (test / stg / prod)
  hosts: lab_workload
  become: true

  vars_files:
    - vars.yml

  vars:
    rhel_org_id: "{{ lookup('ansible.builtin.env', 'RHEL_ORG_ID') }}"
    rhel_activation_key: "{{ lookup('ansible.builtin.env', 'RHEL_ACTIVATION_KEY') }}"
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

  handlers:
    - name: Import the handlers
      ansible.builtin.import_tasks: handlers.yml

  tasks:
    - name: Configure the hostname, timezone and SSH
      ansible.builtin.import_tasks: tasks/common.yml

    - name: Point the repositories at the infra mirror
      ansible.builtin.import_tasks: tasks/workload.yml

    - name: Register the VM with Systems Manager
      ansible.builtin.import_tasks: tasks/ssm-agent.yml

    - name: Register with Red Hat Subscription Management
      ansible.builtin.import_tasks: tasks/rhsm-workload.yml

# WSUSはWindows業務VMの前提(Windows Updateのコンテンツ取得元)なので先に設定する。
- name: Configure the WSUS server
  hosts: lab_wsus
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

  tasks:
    - name: Configure the hostname, timezone and SSH
      ansible.builtin.import_tasks: tasks/common-windows.yml

    - name: Register the VM with Systems Manager
      ansible.builtin.import_tasks: tasks/ssm-agent-windows.yml

    - name: Install and configure WSUS
      ansible.builtin.import_tasks: tasks/wsus.yml

- name: Configure the Windows workload VMs (test / stg / prod)
  hosts: lab_workload-windows
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

  tasks:
    - name: Configure the hostname, timezone and SSH
      ansible.builtin.import_tasks: tasks/common-windows.yml

    - name: Point Windows Update at the WSUS server
      ansible.builtin.import_tasks: tasks/workload-windows.yml

    - name: Register the VM with Systems Manager
      ansible.builtin.import_tasks: tasks/ssm-agent-windows.yml
