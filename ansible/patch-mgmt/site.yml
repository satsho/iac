---
# 家のサーバ(KVMホスト)上で実行し、パッチ管理検証用のVMを作って設定する。
#   export AWS_PROFILE=<SSMのアクティベーションを作れるプロファイル>
#   ansible-playbook -k -K site.yml     # 初回(VMにはISOのユーザーのパスワードで入る)
#   ansible-playbook -K site.yml        # 2回目以降(初回に登録したSSH鍵で入る)
# 何度流してもよい。既にあるVMは作り直さず、設定だけを揃え直す。

- name: Create the lab VMs on the KVM host
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yml

  vars:
    # RHEL 10 は x86-64-v3 のCPUが必須(VMにはhost-passthroughでホストのCPU機能をそのまま見せる)
    x86_64_v3_flags: [avx, avx2, bmi1, bmi2, f16c, fma, abm, movbe, xsave]

  tasks:
    - name: Check that the required commands are installed
      ansible.builtin.command: "which {{ item }}"
      loop: [virsh, virt-install, virt-customize, qemu-img, nft, aws]
      changed_when: false

    - name: Read the host CPU flags
      ansible.builtin.command: grep -m1 ^flags /proc/cpuinfo
      register: cpu_flags
      changed_when: false

    - name: Check that the host CPU supports x86-64-v3
      ansible.builtin.assert:
        that:
          - x86_64_v3_flags | difference(cpu_flags.stdout.split()) | length == 0
        fail_msg: "RHEL 10 に必要なCPU機能が足りません: {{ x86_64_v3_flags | difference(cpu_flags.stdout.split()) }}"

    - name: Check that the installer ISO exists
      ansible.builtin.stat:
        path: "{{ rhel_install_iso }}"
      register: install_iso
      become: true

    - name: Fail when the installer ISO is missing
      ansible.builtin.assert:
        that:
          - install_iso.stat.exists
        fail_msg: "{{ rhel_install_iso }} にImage Builderで作ったRHEL 10.2のISOを置いてください"

    - name: Check that the SSH public key exists
      ansible.builtin.stat:
        path: "{{ ssh_public_key_file | expanduser }}"
      register: ssh_public_key

    - name: Fail when the SSH public key is missing
      ansible.builtin.assert:
        that:
          - ssh_public_key.stat.exists
        fail_msg: "{{ ssh_public_key_file }} が無いので、ssh-keygen で作るか vars.yml の ssh_public_key_file を直してください"

    # AWS CLI はこのplaybookを実行したユーザーの認証情報(AWS_PROFILE等)で動かし、become しない。
    # rootの /root/.aws/credentials は家のサーバ自身のHybrid Activationの一時クレデンシャルで、
    # アクティベーションを作る権限は無い(持たせるべきでもない)。
    - name: Show which AWS identity creates the activations
      ansible.builtin.command: aws sts get-caller-identity --query Arn --output text
      register: aws_identity
      changed_when: false

    - name: Print the AWS identity
      ansible.builtin.debug:
        msg: "SSMのアクティベーションは {{ aws_identity.stdout }} で作成します"

    - name: Create the image directory
      ansible.builtin.file:
        path: "{{ libvirt_image_dir }}"
        state: directory
        mode: "0711"
      become: true

    - name: Set up the egress firewall for the workload network
      ansible.builtin.include_tasks:
        file: tasks/kvm-firewall.yml
        apply:
          become: true

    - name: Define and start the libvirt networks
      ansible.builtin.include_tasks:
        file: tasks/kvm-network.yml
        apply:
          become: true
      loop: "{{ libvirt_networks }}"
      loop_control:
        loop_var: net
        label: "{{ net.name }}"

    - name: Look up the existing VMs
      ansible.builtin.command: "virsh dominfo {{ item.name }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: existing_vms
      changed_when: false
      failed_when: false
      become: true

    - name: Pick the VMs that do not exist yet
      ansible.builtin.set_fact:
        new_vms: "{{ existing_vms.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    # インストールが終わるとISOを外すので、ISOが付いたままのVMはインストール中か、前回の実行が
    # 途中で止まったもの。流し直したときは、それらも「インストールの完了を待って起動する」から続ける
    - name: List the disks of the existing VMs
      ansible.builtin.command: "virsh domblklist {{ item.item.name }}"
      loop: "{{ existing_vms.results | selectattr('rc', 'eq', 0) | list }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: existing_disks
      changed_when: false
      become: true

    - name: Pick the VMs whose installation has not been finished
      ansible.builtin.set_fact:
        unfinished_vms: >-
          {{ new_vms
             + (existing_disks.results
                | selectattr('stdout', 'search', rhel_install_iso | regex_escape)
                | map(attribute='item.item')
                | list) }}

    # インストールは全台同時に始め(virt-installはすぐ戻る)、終わったものから順に起動する
    - name: Start the installations from the ISO
      ansible.builtin.include_tasks:
        file: tasks/kvm-install.yml
        apply:
          become: true
      loop: "{{ new_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    - name: Attach the data disks and boot the installed VMs
      ansible.builtin.include_tasks:
        file: tasks/kvm-finish.yml
        apply:
          become: true
      loop: "{{ unfinished_vms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    - name: Add the VMs to the inventory of this run
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: ["lab", "lab_{{ item.role }}"]
        ansible_host: "{{ (item.nics | first).address }}"
        ansible_user: "{{ vm_user }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ ssh_known_hosts_file }}"
        vm: "{{ item }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Wait until SSH is up on every VM
      ansible.builtin.wait_for:
        host: "{{ (item.nics | first).address }}"
        port: 22
        timeout: 900
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

# infra のミラーが業務VMの前提なので、repository / infra を先に設定する
- name: Configure the repository and infra servers
  hosts: lab_repository:lab_infra
  become: true

  vars_files:
    - vars.yml

  vars:
    rhel_org_id: "{{ lookup('ansible.builtin.env', 'RHEL_ORG_ID') }}"
    rhel_activation_key: "{{ lookup('ansible.builtin.env', 'RHEL_ACTIVATION_KEY') }}"
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

  handlers:
    - name: Import the handlers
      ansible.builtin.import_tasks: handlers.yml

  tasks:
    - name: Configure the hostname, timezone and SSH
      ansible.builtin.import_tasks: tasks/common.yml

    - name: Register the VM with Systems Manager
      ansible.builtin.import_tasks: tasks/ssm-agent.yml

    - name: Set up the Red Hat CDN repositories
      ansible.builtin.import_tasks: tasks/rhsm-mirror.yml

    - name: Mount the mirror data disk
      ansible.builtin.import_tasks: tasks/mirror-disk.yml

    - name: Configure the role of the VM
      ansible.builtin.include_tasks: "tasks/{{ vm.role }}.yml"

- name: Configure the workload VMs (test / stg / prod)
  hosts: lab_workload
  become: true

  vars_files:
    - vars.yml

  vars:
    rhel_org_id: "{{ lookup('ansible.builtin.env', 'RHEL_ORG_ID') }}"
    rhel_activation_key: "{{ lookup('ansible.builtin.env', 'RHEL_ACTIVATION_KEY') }}"
    vm_tags: "{{ {'Name': vm.name} | combine(vm.tags) }}"

  handlers:
    - name: Import the handlers
      ansible.builtin.import_tasks: handlers.yml

  tasks:
    - name: Configure the hostname, timezone and SSH
      ansible.builtin.import_tasks: tasks/common.yml

    - name: Point the repositories at the infra mirror
      ansible.builtin.import_tasks: tasks/workload.yml

    - name: Register the VM with Systems Manager
      ansible.builtin.import_tasks: tasks/ssm-agent.yml

    - name: Register with Red Hat Subscription Management
      ansible.builtin.import_tasks: tasks/rhsm-workload.yml
