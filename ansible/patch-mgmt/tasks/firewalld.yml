---
# firewalld が動いている場合だけ、firewalld_services のサービスを許可する
- name: Check whether firewalld is running
  ansible.builtin.command: systemctl is-active firewalld
  register: firewalld_state
  changed_when: false
  failed_when: false

- name: Check which services firewalld already allows
  ansible.builtin.command: "firewall-cmd --permanent --query-service={{ item }}"
  loop: "{{ firewalld_services }}"
  register: firewalld_query
  changed_when: false
  failed_when: false
  when: firewalld_state.stdout == 'active'

- name: Allow the services in firewalld
  ansible.builtin.command: "firewall-cmd --permanent --add-service={{ item.item }}"
  loop: "{{ firewalld_query.results | default([]) | rejectattr('skipped', 'defined') | selectattr('rc', 'ne', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: firewalld_added
  changed_when: true

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  when: firewalld_added.results | default([]) | length > 0
  changed_when: true
