---
# infra: repositoryからrsyncで同期するミラー。業務VMのネットワークにもNICを持ち、httpで配る
- name: Install the packages for the infra mirror
  ansible.builtin.dnf:
    name: [httpd, rsync]
    state: present

- name: Install the mirror sync script
  ansible.builtin.template:
    src: patch-mirror-sync.sh.j2
    dest: /usr/local/sbin/patch-mirror-sync.sh
    mode: "0755"

- name: Install the mirror sync service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [patch-mirror-sync.service, patch-mirror-sync.timer]
  notify: Reload systemd

# 業務VM側のネットワークは仮想FWで外への通信が絞られているので、infraのデフォルトルートやDNSに使わせない
- name: Find the interface on the workload network
  ansible.builtin.set_fact:
    workload_iface: >-
      {{ ansible_facts.interfaces
         | map('regex_replace', '[^A-Za-z0-9_]', '_')
         | map('extract', ansible_facts)
         | selectattr('macaddress', 'defined')
         | selectattr('macaddress', 'equalto', (vm.nics | selectattr('address', 'equalto', infra_workload_ip) | first).mac)
         | map(attribute='device')
         | first }}

- name: Read the connection on the workload network
  ansible.builtin.command: "nmcli -g GENERAL.CONNECTION device show {{ workload_iface }}"
  register: workload_connection
  changed_when: false

- name: Read whether the workload network may carry the default route
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.never-default, connection, show, "{{ workload_connection.stdout }}"]
  register: workload_never_default
  changed_when: false

- name: Keep the default route and DNS on the NAT network
  when: workload_never_default.stdout != 'yes'
  block:
    - name: Mark the workload network as never-default
      ansible.builtin.command:
        argv: [nmcli, connection, modify, "{{ workload_connection.stdout }}", ipv4.never-default, "yes", ipv4.ignore-auto-dns, "yes"]
      changed_when: true

    - name: Reapply the workload network settings
      ansible.builtin.command: "nmcli device reapply {{ workload_iface }}"
      changed_when: true

- name: Allow http in firewalld
  ansible.builtin.include_tasks: firewalld.yml
  vars:
    firewalld_services: [http]

- name: Apply the systemd and service changes
  ansible.builtin.meta: flush_handlers

# 初回のミラー同期は、repositoryのreposyncが終わってから手動で行う(README参照)
- name: Start the web server and mirror sync timer
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [httpd, patch-mirror-sync.timer]
