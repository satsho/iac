---
# KVMホスト: 業務VMのネットワーク向けの仮想FW(nftables)。libvirtのネットワークより先に用意する。
- name: Pick the network protected by the egress firewall
  ansible.builtin.set_fact:
    fw_net: "{{ libvirt_networks | selectattr('egress_firewall', 'defined') | selectattr('egress_firewall') | first }}"

- name: Install the firewall rules
  ansible.builtin.template:
    src: patch-mgmt-fw.nft.j2
    dest: /etc/nftables/patch-mgmt-fw.nft
    mode: "0600"
  register: fw_rules

- name: Install the service that loads the firewall rules
  ansible.builtin.template:
    src: patch-mgmt-fw.service.j2
    dest: /etc/systemd/system/patch-mgmt-fw.service
    mode: "0644"
  register: fw_unit

- name: Start the firewall on boot
  ansible.builtin.systemd:
    name: patch-mgmt-fw.service
    daemon_reload: "{{ fw_unit.changed }}"
    enabled: true
    state: started
  register: fw_started

# ルールを変えたときはテーブルを作り直す(許可リストは空に戻るが、業務VMが次に名前解決したときに入れ直される)
- name: Reload the firewall rules
  ansible.builtin.systemd:
    name: patch-mgmt-fw.service
    state: restarted
  when: (fw_rules.changed or fw_unit.changed) and not fw_started.changed

# 業務VMのDNSサーバ。許可ドメインの答えのIPを、上のテーブルの許可リストに入れる
# (RHELのdnsmasqはnftset機能なしでビルドされているので、libvirtのdnsmasqの代わりに使う)
- name: Install the DNS server that fills the allowlist
  ansible.builtin.template:
    src: patch-mgmt-dns.py.j2
    dest: /usr/local/sbin/patch-mgmt-dns.py
    mode: "0755"
  register: dns_script

- name: Install the service of the DNS server
  ansible.builtin.template:
    src: patch-mgmt-dns.service.j2
    dest: /etc/systemd/system/patch-mgmt-dns.service
    mode: "0644"
  register: dns_unit

- name: Start the DNS server on boot
  ansible.builtin.systemd:
    name: patch-mgmt-dns.service
    daemon_reload: "{{ dns_unit.changed }}"
    enabled: true
    state: started
  register: dns_started

- name: Restart the DNS server
  ansible.builtin.systemd:
    name: patch-mgmt-dns.service
    state: restarted
  when: (dns_script.changed or dns_unit.changed) and not dns_started.changed
