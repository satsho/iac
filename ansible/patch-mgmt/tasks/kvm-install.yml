---
# KVMホスト: ゴールデンイメージ(packer/rhel10-golden.pkr.hcl で作成済み)をクローンして
# VMを作る(loop_var: vm)。フルのOSインストールはゴールデンイメージを作るときの
# 1回だけで済み、ここでは「ディスクをコピーして定義するだけ」なので速い。
#
# ミラー用データディスクは、ゴールデンイメージには含めず、ここでは付けない
# (kvm-finish.ymlで、VMを停止状態のまま付ける)。
- name: Check that the golden image exists
  ansible.builtin.stat:
    path: "{{ golden_image_path }}"
  register: golden_image

- name: Fail when the golden image is missing
  ansible.builtin.assert:
    that:
      - golden_image.stat.exists
    fail_msg: >-
      {{ golden_image_path }} が無いので、先に ansible/patch-mgmt/packer で
      `packer build rhel10-golden.pkr.hcl` を実行してゴールデンイメージを作ってください
      (ansible/patch-mgmt/packer/README.md参照)。

# 0700だとQEMU(root以外のuid、通常qemu)がディレクトリをトラバースできず
# ディスクファイル自体は644で読めるのに "Permission denied" で起動に失敗する。
# 711(一覧表示はさせないが、ファイル名を知っていればアクセスは許可)にする。
- name: Create the VM directory - {{ vm.name }}
  ansible.builtin.file:
    path: "{{ libvirt_image_dir }}/{{ vm.name }}"
    state: directory
    mode: "0711"

# -b でゴールデンイメージをbacking fileとして指定するクローン(copy-on-write)。
# 実際にディスクを使う分だけ増えるので、一瞬で終わり、ディスクの消費も最小限。
- name: Clone the golden image for the root disk - {{ vm.name }}
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - -F
      - qcow2
      - -b
      - "{{ golden_image_path }}"
      - "{{ libvirt_image_dir }}/{{ vm.name }}/root.qcow2"
    creates: "{{ libvirt_image_dir }}/{{ vm.name }}/root.qcow2"

# DHCPを使わない設計(vars.yml参照)なので、起動前にNetworkManagerの接続定義を
# 直接ディスクへ書き込んでおく。MACアドレスで紐付けるので、クローン先のVMで
# インターフェース名がens3/enp1s0のどちらになっても問題ない。
- name: Render the static network config for each NIC - {{ vm.name }}
  ansible.builtin.template:
    src: static-nic.nmconnection.j2
    dest: "/tmp/{{ vm.name }}-{{ nic.network }}.nmconnection"
    mode: "0600"
  loop: "{{ vm.nics }}"
  loop_control:
    loop_var: nic
    label: "{{ nic.network }}"
  vars:
    net: "{{ libvirt_networks | selectattr('name', 'equalto', nic.network) | first }}"
    is_primary: "{{ nic == vm.nics[0] }}"

# クローンしたディスクへ、ゲストを起動せずに直接ファイルを書き込む(libguestfs)。
- name: Inject the static network config into the cloned disk - {{ vm.name }}
  ansible.builtin.command:
    cmd: >-
      virt-customize -a {{ libvirt_image_dir }}/{{ vm.name }}/root.qcow2
      --run-command 'rm -f /etc/NetworkManager/system-connections/*'
      {% for nic in vm.nics %}
      --upload /tmp/{{ vm.name }}-{{ nic.network }}.nmconnection:/etc/NetworkManager/system-connections/{{ nic.network }}.nmconnection
      {% endfor %}
      --run-command 'chmod 600 /etc/NetworkManager/system-connections/*.nmconnection'
      --selinux-relabel
  changed_when: true

- name: Remove the rendered network config files - {{ vm.name }}
  ansible.builtin.file:
    path: "/tmp/{{ vm.name }}-{{ nic.network }}.nmconnection"
    state: absent
  loop: "{{ vm.nics }}"
  loop_control:
    loop_var: nic
    label: "{{ nic.network }}"

# --import なのでOSインストールは発生しない(既にインストール済みのディスクを
# そのまま使う)。--noreboot で起動はせず定義だけ行い、kvm-finish.yml で
# データディスクを付けたうえで起動する。
- name: Define the VM from the cloned disk - {{ vm.name }}
  ansible.builtin.command:
    cmd: >-
      virt-install
      --name {{ vm.name }}
      --memory {{ vm.memory_mb }}
      --vcpus {{ vm.vcpus }}
      --cpu host-passthrough
      --os-variant {{ os_variant }}
      --import
      --noreboot
      --disk path={{ libvirt_image_dir }}/{{ vm.name }}/root.qcow2,bus=virtio
      {% for nic in vm.nics %}--network network={{ nic.network }},mac={{ nic.mac }},model=virtio {% endfor %}
      --graphics vnc,listen=127.0.0.1
      --noautoconsole
  changed_when: true
