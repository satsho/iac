---
# 業務VM: 環境変数のactivation keyがあればRHSMに登録する(仮想FWが有効なときは
# subscription.rhsm.redhat.comだけを通す想定)。subscription-managerにはrepoファイルを
# 管理させず、CDNのリポジトリは使わない。
- name: Stop subscription-manager from managing repo files
  ansible.builtin.command: subscription-manager config --rhsm.manage_repos=0
  changed_when: false

# ゴールデンイメージはPacker側でunregisterしてあるので、クローンした直後は
# 必ず未登録の状態になる。ISOの自動登録を待つ必要は無い(Anacondaの%postで
# 一度きり実行されるものなので、クローン後の起動では二度と走らない)。
- name: Check whether RHSM is already registered
  ansible.builtin.command: subscription-manager identity
  register: rhsm_identity
  changed_when: false
  failed_when: false

# 自動登録が終わっていない場合だけ、環境変数のactivation keyがあれば登録する。
# 無ければ止めずに警告だけ出す(パッチ適用はinfraのミラーで行うので、登録が無くても検証は進められる)。
- name: Register with the activation key
  ansible.builtin.command:
    argv: [subscription-manager, register, "--org={{ rhel_org_id }}", "--activationkey={{ rhel_activation_key }}"]
  when: rhsm_identity.rc != 0 and rhel_org_id | length > 0 and rhel_activation_key | length > 0
  changed_when: true
  no_log: true

- name: Warn that the VM is not registered with RHSM
  ansible.builtin.debug:
    msg: >-
      {{ vm.name }} はRHSMに登録されていません。環境変数 RHEL_ORG_ID / RHEL_ACTIVATION_KEY を
      設定して流し直してください(パッチ適用はinfraのミラーで行うので、登録が無くても検証は進められます)。
  when: rhsm_identity.rc != 0 and (rhel_org_id | length == 0 or rhel_activation_key | length == 0)
