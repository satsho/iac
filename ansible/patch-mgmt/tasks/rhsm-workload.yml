---
# 業務VM: RHSMには登録する(サブスクリプションの利用状況を正しく残すため)が、通信はinfraのプロキシ経由にし、
# subscription-managerにはrepoファイルを管理させない(CDNのリポジトリは使わない)。
# ISOの自動登録は初回起動時に外へ出られず失敗しているはずなので、ここで登録する。
- name: Route subscription-manager through the infra proxy and stop it managing repo files
  ansible.builtin.command:
    argv:
      - subscription-manager
      - config
      - "--server.proxy_hostname={{ infra_workload_ip }}"
      - "--server.proxy_port={{ proxy_port }}"
      - --rhsm.manage_repos=0
  changed_when: false

- name: Check the registration
  ansible.builtin.command: subscription-manager identity
  register: rhsm_identity
  changed_when: false
  failed_when: false

- name: Register with Red Hat Subscription Management through the proxy
  when: rhsm_identity.rc != 0
  block:
    - name: Check that the Red Hat activation key is provided
      ansible.builtin.assert:
        that:
          - rhel_org_id | length > 0
          - rhel_activation_key | length > 0
        fail_msg: 業務VMのRHSM登録に、環境変数 RHEL_ORG_ID / RHEL_ACTIVATION_KEY が必要です

    - name: Register with the activation key
      ansible.builtin.command:
        argv: [subscription-manager, register, "--org={{ rhel_org_id }}", "--activationkey={{ rhel_activation_key }}"]
      changed_when: true
      no_log: true
