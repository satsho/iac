---
# 全VM共通: SSM AgentをインストールしてHybrid Activationで登録し、タグを同期する。
# 業務VMも、KVMホストの仮想FWが許可したSSMの宛先には直接出られる。
- name: Check whether the SSM Agent is already registered
  ansible.builtin.stat:
    path: /var/lib/amazon/ssm/registration
  register: ssm_registration

- name: Install and register the SSM Agent
  when: not ssm_registration.stat.exists
  block:
    - name: Download the SSM Agent
      ansible.builtin.get_url:
        url: "https://amazon-ssm-{{ aws_region }}.s3.{{ aws_region }}.amazonaws.com/latest/linux_amd64/amazon-ssm-agent.rpm"
        dest: /tmp/amazon-ssm-agent.rpm
        mode: "0644"

    # AWSの公式ドキュメント(Verifying the signature of SSM Agent)に掲載されている公開鍵を
    # そのままコミットして使う(実行のたびに外部から取得すると、取得元の改ざん・リンク切れ・
    # 古い鍵を掴むリスクがあるため)。鍵を更新したときはfingerprintもあわせて直すこと。
    # https://docs.aws.amazon.com/systems-manager/latest/userguide/verify-agent-signature.html
    - name: Copy the SSM Agent public key
      ansible.builtin.copy:
        src: amazon-ssm-agent.gpg
        dest: /tmp/amazon-ssm-agent.gpg
        mode: "0644"

    - name: Read the fingerprint of the public key
      ansible.builtin.command: gpg --quiet --with-colons --with-fingerprint /tmp/amazon-ssm-agent.gpg
      register: ssm_gpg_fingerprint
      changed_when: false

    - name: Fail when the public key fingerprint does not match the known value
      ansible.builtin.assert:
        that:
          - "'1C5B395CBE5E74E2F1CA21592784DBF388D19D46' in ssm_gpg_fingerprint.stdout"
        fail_msg: >-
          SSM Agentの公開鍵のfingerprintが想定値(1C5B 395C BE5E 74E2 F1CA 2159 2784 DBF3 88D1 9D46)と
          異なります。files/amazon-ssm-agent.gpgが壊れているか改ざんされています。

    # AWSのSSM Agent署名鍵(fingerprintは上で確認済み)は、ユーザーIDへの自己署名が
    # いまだにSHA1のため、RHEL 10の既定ポリシーでは「SHA1は安全でない」として
    # rpm --import 自体が拒否される(鍵の中身やGPG検証を省略しているわけではない)。
    # インポートの間だけ一時的にSHA1を許可し、終わったら必ず元のポリシーへ戻す。
    # https://www.redhat.com/en/blog/rhel-security-sha-1-package-signatures-distrusted-rhel-9
    - name: Read the current system-wide crypto policy
      ansible.builtin.command: update-crypto-policies --show
      register: crypto_policy_before
      changed_when: false

    # dnfはパッケージインストール時にも鍵の自己署名を(インポート時と同じく)再検証するため、
    # ポリシーを戻す前にインポートとインストールの両方を終わらせる。
    - name: Import the public key and install the SSM Agent
      block:
        # RHEL 10には`DEFAULT:SHA1`サブポリシーモジュールが無い(RHEL 9にはあった)。
        # SHA1を許可する最も近いベースポリシーはLEGACY。
        - name: Temporarily allow SHA1 to import the SSM Agent public key
          ansible.builtin.command: update-crypto-policies --set LEGACY
          changed_when: true

        - name: Import the public key
          ansible.builtin.command:
            argv: [rpm, --import, /tmp/amazon-ssm-agent.gpg]
          changed_when: true

        - name: Install the SSM Agent
          ansible.builtin.dnf:
            name: /tmp/amazon-ssm-agent.rpm
            disablerepo: "*"
            state: present
      always:
        - name: Restore the system-wide crypto policy
          ansible.builtin.command: "update-crypto-policies --set {{ crypto_policy_before.stdout | trim }}"
          changed_when: true

    # VMごとに使い捨てのアクティベーション(登録1回限り、既定で24時間で失効)を作る。
    # AWS CLIはplaybookを実行したユーザーの認証情報で動かす(KVMホストのrootの認証情報は使わない)。
    - name: Create a single-use SSM activation for this VM
      ansible.builtin.command:
        argv:
          - aws
          - ssm
          - create-activation
          - --region
          - "{{ aws_region }}"
          - --iam-role
          - "{{ ssm_hybrid_role }}"
          - --default-instance-name
          - "{{ vm.name }}"
          - --description
          - "patch-mgmt lab VM {{ vm.name }}"
          - --registration-limit
          - "1"
          - --tags
          - "{{ vm_tags | dict2items(key_name='Key', value_name='Value') | to_json }}"
          - --output
          - json
      delegate_to: localhost
      connection: local
      become: false
      register: ssm_activation
      changed_when: true
      no_log: true

    - name: Stop the SSM Agent before registering
      ansible.builtin.systemd:
        name: amazon-ssm-agent
        state: stopped

    - name: Register the VM with Systems Manager
      ansible.builtin.command:
        argv:
          - amazon-ssm-agent
          - -register
          - -code
          - "{{ (ssm_activation.stdout | from_json).ActivationCode }}"
          - -id
          - "{{ (ssm_activation.stdout | from_json).ActivationId }}"
          - -region
          - "{{ aws_region }}"
      changed_when: true
      no_log: true

    - name: Remove the downloaded SSM Agent package and public key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/amazon-ssm-agent.rpm
        - /tmp/amazon-ssm-agent.gpg

- name: Start the SSM Agent
  ansible.builtin.systemd:
    name: amazon-ssm-agent
    enabled: true
    state: started

- name: Read the managed node ID
  ansible.builtin.slurp:
    src: /var/lib/amazon/ssm/registration
  register: ssm_registration_file

# アクティベーションのタグは登録時にしか付かないので、vars.yml のタグを毎回マネージドノードに上書きする
- name: Sync the tags of the managed node with vars.yml
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - add-tags-to-resource
      - --region
      - "{{ aws_region }}"
      - --resource-type
      - ManagedInstance
      - --resource-id
      - "{{ (ssm_registration_file.content | b64decode | from_json).ManagedInstanceID }}"
      - --tags
      - "{{ vm_tags | dict2items(key_name='Key', value_name='Value') | to_json }}"
  delegate_to: localhost
  connection: local
  become: false
  changed_when: false
