---
# パッチ管理検証用VMの定義。site.yml / destroy.yml の両方から読む。

aws_region: ap-northeast-1
timezone: Asia/Tokyo

# Terraform(terraform/environments/patch-mgmt)の output hybrid_node_role_name
ssm_hybrid_role: iac-poc-patch-hybrid-node-role
# Terraform(terraform/environments/patch-mgmt)の output inventory_bucket_name
inventory_bucket: iac-poc-patch-inventory-563613886922

# ---------------------------------------------------------------------------
# KVMホスト
# ---------------------------------------------------------------------------

# VMのディスクを置く場所
libvirt_image_dir: /var/lib/libvirt/images/patch-mgmt
# packer/rhel10-golden.pkr.hcl で1回だけビルドするゴールデンイメージ。
# 各VMのディスクはこれをbacking fileとしてクローンする(packer/README.md参照)。
golden_image_path: "{{ libvirt_image_dir }}/rhel10-golden.qcow2"
# virt-install --os-variant に渡す値(osinfo-query os | grep rhel10 で確認)
os_variant: rhel10.0

# packer/windows2025-golden.pkr.hcl で1回だけビルドするWindows側のゴールデンイメージ。
golden_image_path_windows: "{{ libvirt_image_dir }}/windows2025-golden.qcow2"
# virt-install --os-variant に渡す値。`osinfo-query os | grep -i "server 2025"`で確認し、
# 見つからない場合(osinfo-dbがまだWindows Server 2025に対応していない場合)は
# win2k22で代用する(ゲストOSの最適化ヒントが多少ずれるだけで、動作自体には影響しない)。
os_variant_windows: win2k25

# ---------------------------------------------------------------------------
# VMへのSSH
# ---------------------------------------------------------------------------

# ISOで作ったユーザー(wheel)。初回はパスワードで入るので -k(--ask-pass)を付けて実行する
vm_user: sho
# 初回にVMへ登録する公開鍵(playbookを実行するユーザーのもの)
ssh_public_key_file: "~/.ssh/id_ed25519.pub"
# 鍵を登録したあと、パスワードでのSSHログインを止める(コンソールからはパスワードで入れる)
ssh_password_authentication: false
# VMは作り直すとホスト鍵が変わるので、普段のknown_hostsとは分けておく(destroy.ymlで消す)
ssh_known_hosts_file: "~/.ssh/known_hosts_patch_mgmt"
# WindowsVMのSSH接続ユーザー(OpenSSH Server + Administratorsグループ前提、common-windows.yml参照)
vm_user_windows: Administrator

# ---------------------------------------------------------------------------
# ネットワーク
# ---------------------------------------------------------------------------
# patch-mgmt     : NAT。repository / infra がRed Hat CDNとAWS(SSM)に出るためのネットワーク
# patch-workload : NAT + 仮想FW。test / stg / prod と infra の2枚目のNIC
#                  業務VMが外に出られるのは workload_egress_allowlist のドメインだけ(KVMホストのnftablesで制御)。
#                  パッケージはinfraのミラー(同じネットワーク上なのでFWを通らない)から取る
# IPアドレスは下の vms の nics を元に、libvirtのDHCPでMACアドレスに固定で払い出す。

# KVMホスト自身が自宅LANに繋がっているインターフェース(kea-dhcp4がここでDHCPを配っている)。
# dnsmasq 2.90の--bind-dynamicのバグ対策(network.xml.j2参照)で、libvirtのdnsmasqに
# このインターフェースを明示的に除外させるために使う。`ip -br link show`で確認できる。
host_lan_interface: enp1s0

# DHCPは使わない(VM側にゴールデンイメージのクローン直後、起動前に固定IPを書き込む。
# kvm-install.ymlのstatic-nic.nmconnection.j2参照)。理由はdnsmasq 2.90の
# bind-dynamicのバグでホストのLAN側DHCP(kea-dhcp4)とポート67を取り合うため。
libvirt_networks:
  - name: patch-mgmt
    bridge: virbr-patchm
    forward: nat
    address: 192.168.150.1
    netmask: 255.255.255.0
    prefix: 24
  - name: patch-workload
    bridge: virbr-patchw
    forward: nat
    # TODO: ホストのdnsmasqがnftset非対応のビルドのため、起動時にエラーになり一時的にfalseにしている。
    # dnsmasqをnftset対応でビルドし直すか、ipset+iptables-nftに設計変更してtrueに戻すこと。
    egress_firewall: false
    address: 192.168.151.1
    netmask: 255.255.255.0
    prefix: 24

# 下の vms の nics と同じ値にしておく(rsyncの許可先・repoファイルに使う)
repository_ip: 192.168.150.10
infra_mgmt_ip: 192.168.150.11
infra_workload_ip: 192.168.151.11
# WSUS(patch-wsus)のpatch-workload側アドレス。test-win/stg-win/prod-winが
# Windows Updateの取得元として参照する(workload-windows.yml参照)。
wsus_workload_ip: 192.168.151.27

# ---------------------------------------------------------------------------
# 業務VMの仮想FW(KVMホストのnftables)
# ---------------------------------------------------------------------------
# 業務VMが名前解決したときに、libvirtのdnsmasqが下のドメイン(サブドメインを含む)のIPアドレスを
# nftablesの許可リストに自動で追加する。リストに無い宛先(cdn.redhat.com、家のLANなど)への通信は
# KVMホストで落とし、カーネルログに "patch-mgmt-fw drop:" として残す。
workload_egress_firewall_table: patch_mgmt_fw
workload_egress_allowlist:
  # TCP 443
  https:
    - ssm.ap-northeast-1.amazonaws.com          # SSM Agent
    - ssmmessages.ap-northeast-1.amazonaws.com  # SSM Agent
    - ec2messages.ap-northeast-1.amazonaws.com  # SSM Agent(名前にec2と付くが、オンプレのVMでも使う通信先)
    - logs.ap-northeast-1.amazonaws.com         # Run Commandの出力
    - s3.ap-northeast-1.amazonaws.com           # SSM Agent本体、パッチ処理用ファイル(バケットのサブドメインを含む)
    - subscription.rhsm.redhat.com              # RHSMへの登録(ISOの自動登録)
  # UDP 123
  ntp:
    - rhel.pool.ntp.org                         # chronyの既定の参照先(時刻がずれるとAWS APIの署名が通らない)

# ---------------------------------------------------------------------------
# リポジトリ同期
# ---------------------------------------------------------------------------

# subscription-manager release --set に渡すマイナーリリース。空ならリリース固定を解除する
rhel_release: "10.2"
# ミラー上のディレクトリ: /var/www/html/repos/rhel/<release_dir>/<upstream_reposのキー>/
release_dir: "{{ rhel_release if rhel_release | length > 0 else 'latest' }}"
# repositoryがreposyncするRed Hat CDNのリポジトリ。キーはミラー上のディレクトリ名
# EUSが使えないサブスクリプションの場合は rhel-10-for-x86_64-baseos-rpms 等に切り替える
upstream_repos:
  baseos: rhel-10-for-x86_64-baseos-eus-rpms
  appstream: rhel-10-for-x86_64-appstream-eus-rpms
# systemdのOnCalendar形式(timezone基準)
reposync_schedule: "*-*-* 00:00:00"
mirror_sync_schedule: "*-*-* 01:00:00"
# 各VMのSSM Inventory収集(Terraformのinventory_schedule、デフォルトJST 08:15)の後、
# Glueクローラ(Terraformのinventory_crawler_schedule、デフォルトJST 09:00)の前に流す。
# test/stg/prodは平日7時〜23時だけ起動するため(vm_schedule_start_calendar/
# vm_schedule_stop_calendar)、VM停止時間帯(23時〜7時)には設定しないこと。
trivy_scan_schedule: "*-*-* 08:30:00"

# ---------------------------------------------------------------------------
# VM
# ---------------------------------------------------------------------------
# tags は SSM のマネージドノードに付くタグ(Name はVM名が自動で付く)。playbookを流すたびに同期する。
# PatchGroup は Terraform の patch_baselines/windows_patch_baselines のキー
# (rhel10-<キー> / win2025-<キー>)と一致させること。
# data_size_gb があるVMには、VMを作り直しても消えないミラー用/コンテンツ用データディスクを付ける。
# nics の1つ目のアドレスに、KVMホストからSSHする(複数NIC持つVMは、patch-mgmt側を1つ目にする
# =デフォルトルートをpatch-mgmt経由にする。patch-infra/patch-wsusを参照)。
# os: windows が無いVMは全てRHEL扱い(site.yml参照)。roleはworkload-windows(Windows業務VM)/
# wsus(WSUSサーバ)を追加で使う。

vms:
  - name: patch-repository
    role: repository
    memory_mb: 4096
    vcpus: 2
    data_size_gb: 150
    nics:
      - { network: patch-mgmt, mac: "52:54:00:15:00:10", address: 192.168.150.10 }
    tags: { Role: repository, Environment: mgmt, App: repo-mirror, PatchGroup: rhel10-mgmt }

  - name: patch-infra
    role: infra
    memory_mb: 4096
    vcpus: 2
    data_size_gb: 150
    nics:
      - { network: patch-mgmt, mac: "52:54:00:15:00:11", address: 192.168.150.11 }
      - { network: patch-workload, mac: "52:54:00:15:01:11", address: 192.168.151.11 }
    tags: { Role: infra, Environment: mgmt, App: repo-mirror, PatchGroup: rhel10-mgmt }

  - name: patch-test
    role: workload
    memory_mb: 2048
    vcpus: 2
    nics:
      - { network: patch-workload, mac: "52:54:00:15:01:21", address: 192.168.151.21 }
    tags: { Role: workload, Environment: test, App: sample-app, PatchGroup: rhel10-test }

  - name: patch-stg
    role: workload
    memory_mb: 2048
    vcpus: 2
    nics:
      - { network: patch-workload, mac: "52:54:00:15:01:22", address: 192.168.151.22 }
    tags: { Role: workload, Environment: stg, App: sample-app, PatchGroup: rhel10-stg }

  - name: patch-prod
    role: workload
    memory_mb: 2048
    vcpus: 2
    nics:
      - { network: patch-workload, mac: "52:54:00:15:01:23", address: 192.168.151.23 }
    tags: { Role: workload, Environment: prod, App: sample-app, PatchGroup: rhel10-prod }

  # --- Windows ---
  # osキー(windows)が無いVMは全てRHEL扱い(site.yml参照)。
  # WindowsはPackerのゴールデンイメージ+virt-customizeのfirstbootスクリプトで
  # クローンする(packer/windows2025-golden.pkr.hcl、kvm-install-windows.yml)。

  - name: patch-wsus
    role: wsus
    os: windows
    memory_mb: 4096
    vcpus: 2
    data_size_gb: 100
    nics:
      - { network: patch-mgmt, mac: "52:54:00:15:00:12", address: 192.168.150.12 }
      - { network: patch-workload, mac: "52:54:00:15:01:27", address: 192.168.151.27 }
    tags: { Role: wsus, Environment: mgmt, App: wsus, PatchGroup: win2025-mgmt }

  - name: patch-test-win
    role: workload-windows
    os: windows
    memory_mb: 4096
    vcpus: 2
    nics:
      - { network: patch-workload, mac: "52:54:00:15:01:24", address: 192.168.151.24 }
    tags: { Role: workload, Environment: test, App: sample-app, PatchGroup: win2025-test }

  - name: patch-stg-win
    role: workload-windows
    os: windows
    memory_mb: 4096
    vcpus: 2
    nics:
      - { network: patch-workload, mac: "52:54:00:15:01:25", address: 192.168.151.25 }
    tags: { Role: workload, Environment: stg, App: sample-app, PatchGroup: win2025-stg }

  - name: patch-prod-win
    role: workload-windows
    os: windows
    memory_mb: 4096
    vcpus: 2
    nics:
      - { network: patch-workload, mac: "52:54:00:15:01:26", address: 192.168.151.26 }
    tags: { Role: workload, Environment: prod, App: sample-app, PatchGroup: win2025-prod }

# ---------------------------------------------------------------------------
# 業務VMの起動・停止スケジュール
# ---------------------------------------------------------------------------
# 平日の日中だけ動かし、夜間・週末は停止して電気代・リソースを節約する
# (KVMホスト自身のsystemdタイマーがvirsh start/shutdownを呼ぶ。tasks/vm-schedule.yml参照)。
# role がここに含まれるVMだけが対象。repository/infra/wsusはミラー同期・SSM中継役なので
# 対象外とし、常時稼働のままにする。
vm_schedule_roles: [workload, workload-windows]
# systemdのOnCalendar形式。KVMホスト自身のタイムゾーン(JST前提)で評価される。
vm_schedule_start_calendar: "Mon..Fri 07:00:00"
vm_schedule_stop_calendar: "Mon..Fri 23:00:00"
