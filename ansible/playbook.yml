---
- name: Configure k3s + ArgoCD on the RHEL node
  hosts: localhost
  connection: local
  become: true

  vars:
    kubeconfig: /etc/rancher/k3s/k3s.yaml

  tasks:
    - name: Install kernel-modules-extra matching the running kernel
      ansible.builtin.dnf:
        name: "kernel-modules-extra-{{ ansible_kernel }}"
        state: present

    - name: Load br_netfilter kernel module now
      ansible.builtin.command: modprobe br_netfilter
      changed_when: false

    - name: Persist br_netfilter across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/br_netfilter.conf
        content: "br_netfilter\n"
        mode: "0644"

    - name: Check whether k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s server
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --disable traefik --disable servicelb" sh -
      args:
        executable: /bin/bash
      when: not k3s_bin.stat.exists
      changed_when: true

    - name: Ensure k3s is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Wait for the k3s kubeconfig to be written
      ansible.builtin.wait_for:
        path: "{{ kubeconfig }}"
        timeout: 180

    - name: Wait for the Kubernetes API to accept requests
      ansible.builtin.command: /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }} get --raw=/readyz
      register: k8s_ready
      retries: 30
      delay: 5
      until: k8s_ready.rc == 0
      changed_when: false

    - name: Create the argocd namespace
      ansible.builtin.command: /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }} create namespace argocd
      register: argocd_ns
      failed_when: argocd_ns.rc != 0 and 'AlreadyExists' not in argocd_ns.stderr
      changed_when: argocd_ns.rc == 0

    # applicationsets.argoproj.io CRDのスキーマが大きく、通常のkubectl applyが
    # 付与するlast-applied-configurationアノテーションがKubernetesのアノテーション
    # 上限(256KiB)を超えて失敗する。--server-sideはこのアノテーションを使わない
    # ので回避できる(ArgoCD公式インストール手順でも推奨されている方式)。
    # --force-conflictsは、この修正より前に一度client-side applyで部分的に
    # 作成されてしまった環境でのフィールド所有権競合を解消するために必要
    # (新規インスタンスでは競合するものが無いため無害)。
    - name: Install ArgoCD
      ansible.builtin.command: >
        /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }}
        apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      register: argocd_install
      changed_when: "'unchanged' not in argocd_install.stdout"

    # ApplicationはArgoCD自身が定義するCRDなので、CRDがEstablishedになる前に
    # 後続タスクでkubectl applyすると "no matches for kind Application" になる。
    - name: Wait for the Application CRD to be established
      ansible.builtin.command: >
        /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }}
        wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
      changed_when: false

    - name: Create the keycloak namespace
      ansible.builtin.command: /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }} create namespace keycloak
      register: keycloak_ns
      failed_when: keycloak_ns.rc != 0 and 'AlreadyExists' not in keycloak_ns.stderr
      changed_when: keycloak_ns.rc == 0

    - name: Check whether the Keycloak admin secret already exists
      ansible.builtin.command: /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }} -n keycloak get secret keycloak-admin
      register: keycloak_secret
      failed_when: false
      changed_when: false

    # publicリポジトリにパスワードを平文でコミットしたくないため、
    # Secretはansibleが起動ごとに乱数生成してkubectlで直接投入する
    # (ArgoCDのGitOps管理からは意図的に外す)。
    - name: Generate a random Keycloak admin password
      ansible.builtin.set_fact:
        keycloak_admin_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
      when: keycloak_secret.rc != 0

    - name: Create the Keycloak admin secret
      ansible.builtin.command: >
        /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }} -n keycloak
        create secret generic keycloak-admin
        --from-literal=username=admin
        --from-literal=password={{ keycloak_admin_password }}
      when: keycloak_secret.rc != 0
      changed_when: true

    - name: Save the Keycloak admin password for retrieval via SSM
      ansible.builtin.copy:
        dest: /root/keycloak-admin-credentials.txt
        content: "username=admin\npassword={{ keycloak_admin_password }}\n"
        mode: "0600"
      when: keycloak_secret.rc != 0

    - name: Render the ArgoCD Application manifests (GitOpsのエントリポイント)
      ansible.builtin.template:
        src: templates/argocd-applications.yaml.j2
        dest: /etc/rancher/k3s/argocd-applications.yaml
        mode: "0644"

    - name: Apply the ArgoCD Applications
      ansible.builtin.command: >
        /usr/local/bin/kubectl --kubeconfig={{ kubeconfig }}
        apply -f /etc/rancher/k3s/argocd-applications.yaml
      register: argocd_apps_apply
      changed_when: "'unchanged' not in argocd_apps_apply.stdout"
