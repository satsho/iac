<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="パッチ管理基盤の全体構成: メンテナンスウィンドウ・InstallNow・RebootAndScanの3つの起点が、承認リストとゲートの条件を経てAWS-RunPatchBaselineの実行に合流し、その結果が通知・ダッシュボード・Inventory検索に流れる">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
    .hub { fill: #eef4ff; stroke: #2563eb; stroke-width: 2; }
    .roleBox { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .title { font-family: sans-serif; font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .sub { font-family: sans-serif; font-size: 10.5px; fill: #444444; }
    .num { font-family: sans-serif; font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    .numbg { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.5; }
    .edge { stroke: #1a1a1a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .edgeDashed { stroke: #1a1a1a; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    .label { font-family: sans-serif; font-size: 10.5px; fill: #1a1a1a; }
    .labelbg { fill: #ffffff; opacity: 0.9; }
  </style>

  <!-- Row1: triggers -->
  <rect class="box" x="30" y="40" width="240" height="70" rx="6"/>
  <text class="title" x="150" y="68" text-anchor="middle">メンテナンスウィンドウ</text>
  <text class="sub" x="150" y="86" text-anchor="middle">cron(週次/月次)</text>

  <rect class="box" x="370" y="40" width="260" height="70" rx="6"/>
  <text class="title" x="500" y="68" text-anchor="middle">InstallNow</text>
  <text class="sub" x="500" y="86" text-anchor="middle">手動起動(緊急・早く当てたい)</text>

  <rect class="box" x="700" y="40" width="260" height="70" rx="6"/>
  <text class="title" x="830" y="68" text-anchor="middle">RebootAndScan</text>
  <text class="sub" x="830" y="86" text-anchor="middle">手動起動(手動再起動パターン)</text>

  <!-- Row2: gate / calendar / IAM role -->
  <rect class="box" x="30" y="170" width="240" height="70" rx="6"/>
  <text class="title" x="150" y="198" text-anchor="middle">ゲート</text>
  <text class="sub" x="150" y="216" text-anchor="middle">GatedPatchBaseline Runbook</text>

  <rect class="box" x="300" y="170" width="150" height="70" rx="6"/>
  <text class="title" x="375" y="198" text-anchor="middle">変更カレンダー</text>
  <text class="sub" x="375" y="216" text-anchor="middle" font-size="9.5">コンソールでOPEN/CLOSED管理</text>

  <rect class="roleBox" x="700" y="170" width="260" height="70" rx="6"/>
  <text class="title" x="830" y="196" text-anchor="middle">patch_automation ロール</text>
  <text class="sub" x="830" y="213" text-anchor="middle">①②③④⑧⑩の実行ロール</text>
  <text class="sub" x="830" y="228" text-anchor="middle">(AutomationAssumeRole)</text>

  <!-- Row3: baseline + central hub -->
  <rect class="box" x="30" y="320" width="240" height="90" rx="6"/>
  <text class="title" x="150" y="350" text-anchor="middle">パッチベースライン</text>
  <text class="sub" x="150" y="368" text-anchor="middle">承認ルール(日数/日付)</text>
  <text class="sub" x="150" y="383" text-anchor="middle">+ 個別承認/拒否リスト</text>

  <rect class="hub" x="370" y="320" width="460" height="90" rx="6"/>
  <text class="title" x="600" y="353" text-anchor="middle">AWS-RunPatchBaseline</text>
  <text class="sub" x="600" y="373" text-anchor="middle">Scan / Install の実際の実行</text>
  <text class="sub" x="600" y="388" text-anchor="middle">(SendCommandで対象インスタンスへ)</text>

  <!-- Row4: outputs -->
  <rect class="box" x="30" y="490" width="240" height="70" rx="6"/>
  <text class="title" x="150" y="518" text-anchor="middle">通知</text>
  <text class="sub" x="150" y="536" text-anchor="middle">EventBridge → SNS</text>

  <rect class="box" x="370" y="490" width="260" height="70" rx="6"/>
  <text class="title" x="500" y="518" text-anchor="middle">ダッシュボード</text>
  <text class="sub" x="500" y="536" text-anchor="middle">CollectPatchCompliance(毎時) → CloudWatch</text>

  <rect class="box" x="700" y="490" width="260" height="70" rx="6"/>
  <text class="title" x="830" y="518" text-anchor="middle">Inventory検索</text>
  <text class="sub" x="830" y="536" text-anchor="middle">SSM Inventory → S3 → Glue/Athena</text>

  <!-- Edges -->
  <!-- 2 -> 3 -->
  <line class="edge" x1="150" y1="110" x2="150" y2="168"/>
  <rect class="labelbg" x="152" y="130" width="150" height="14"/>
  <text class="label" x="155" y="141">cron起動(AUTOMATION)</text>

  <!-- 2 -> 4 bypass (RUN_COMMAND) -->
  <path class="edgeDashed" d="M270,75 L330,75 L330,365 L368,365"/>
  <rect class="labelbg" x="276" y="250" width="190" height="14"/>
  <text class="label" x="279" y="261">cron起動(RUN_COMMAND、ゲート無し)</text>

  <!-- 7 -> 3 -->
  <line class="edge" x1="300" y1="205" x2="272" y2="205"/>
  <text class="label" x="277" y="198" font-size="9">確認</text>

  <!-- 3 -> 4 -->
  <path class="edge" d="M150,240 L150,280 L392,280 L392,318"/>
  <rect class="labelbg" x="160" y="266" width="170" height="14"/>
  <text class="label" x="163" y="277">条件を満たせば実行</text>

  <!-- 1 -> 4 -->
  <line class="edge" x1="270" y1="365" x2="368" y2="365"/>
  <rect class="labelbg" x="276" y="352" width="110" height="14"/>
  <text class="label" x="279" y="363">承認済みのみ対象</text>

  <!-- 5 -> 4 -->
  <line class="edge" x1="500" y1="110" x2="500" y2="318"/>
  <rect class="labelbg" x="505" y="255" width="150" height="14"/>
  <text class="label" x="508" y="266">即時実行(承認は必須)</text>

  <!-- 5 -> 1 (optional) -->
  <path class="edgeDashed" d="M580,110 L580,300 L232,300 L232,318"/>
  <rect class="labelbg" x="400" y="286" width="170" height="14"/>
  <text class="label" x="403" y="297">任意: 承認リストに追記</text>

  <!-- 6 -> 4 -->
  <path class="edge" d="M790,110 L790,300 L720,300 L720,318"/>
  <rect class="labelbg" x="628" y="286" width="90" height="14"/>
  <text class="label" x="631" y="297">再起動→Scan</text>

  <!-- 4 -> 8 -->
  <path class="edge" d="M460,410 L460,452 L150,452 L150,488"/>
  <rect class="labelbg" x="160" y="438" width="80" height="14"/>
  <text class="label" x="163" y="449">実行結果</text>

  <!-- 4 -> 9 -->
  <path class="edge" d="M600,410 L600,452 L500,452 L500,488"/>
  <rect class="labelbg" x="505" y="438" width="50" height="14"/>
  <text class="label" x="508" y="449">状態</text>

  <!-- 4 -> 10 (independent) -->
  <path class="edgeDashed" d="M790,410 L790,452 L830,452 L830,488"/>
  <rect class="labelbg" x="700" y="438" width="150" height="14"/>
  <text class="label" x="703" y="449">(独立: 毎日収集)</text>

  <!-- number badges -->
  <circle class="numbg" cx="42" cy="52" r="13"/><text class="num" x="42" y="56" text-anchor="middle">1</text>
  <circle class="numbg" cx="382" cy="52" r="13"/><text class="num" x="382" y="56" text-anchor="middle">2</text>
  <circle class="numbg" cx="712" cy="52" r="13"/><text class="num" x="712" y="56" text-anchor="middle">3</text>
  <circle class="numbg" cx="42" cy="182" r="13"/><text class="num" x="42" y="186" text-anchor="middle">4</text>
  <circle class="numbg" cx="382" cy="182" r="13"/><text class="num" x="382" y="186" text-anchor="middle">5</text>
  <circle class="numbg" cx="712" cy="182" r="13"/><text class="num" x="712" y="186" text-anchor="middle">6</text>
  <circle class="numbg" cx="42" cy="332" r="13"/><text class="num" x="42" y="336" text-anchor="middle">7</text>
  <circle class="numbg" cx="382" cy="332" r="13"/><text class="num" x="382" y="336" text-anchor="middle">8</text>
  <circle class="numbg" cx="42" cy="502" r="13"/><text class="num" x="42" y="506" text-anchor="middle">9</text>
  <circle class="numbg" cx="378" cy="502" r="15"/><text class="num" x="378" y="506" text-anchor="middle">10</text>
  <circle class="numbg" cx="712" cy="502" r="15"/><text class="num" x="712" y="506" text-anchor="middle">11</text>

  <figcaption></figcaption>
</svg>
