# honeypot-postgresが先にSyncされている必要がある(manifests/cowrie/README.md参照)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cowrie
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/satsho/iac.git
    targetRevision: main
    path: manifests/cowrie
  destination:
    server: https://kubernetes.default.svc
    namespace: honeypot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
