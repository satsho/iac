# honeypot-postgres-secrets シークレットを事前に作成しておくこと(manifests/honeypot-postgres/README.md参照)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: honeypot-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/satsho/iac.git
    targetRevision: main
    path: manifests/honeypot-postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: honeypot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
