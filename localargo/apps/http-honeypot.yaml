# honeypot-postgres-secrets シークレットが既に存在すること(manifests/honeypot-postgres/README.md参照)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: http-honeypot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/satsho/iac.git
    targetRevision: main
    path: manifests/http-honeypot
  destination:
    server: https://kubernetes.default.svc
    namespace: honeypot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
