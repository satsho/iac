# oauth2-proxy-hermes-secrets シークレットを事前に作成しておくこと
# (manifests/oauth2-proxy-hermes/README.md参照)。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy-hermes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/satsho/iac.git
    targetRevision: main
    path: manifests/oauth2-proxy-hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
