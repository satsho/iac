# SSM Hybrid Activationが自宅サーバのroot:root所有の/root/.aws/credentialsを
# 約30分おきに自動更新する。このCronJobはそれを15分おきに読み取り、
# cert-manager Podが読めるk8s Secret(aws-ambient-credentials)へコピーする。
# runAsUser: 0はこのhostPathファイル(root専用)を読むために必須。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-aws-ambient-credentials
  namespace: cert-manager
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: aws-credentials-syncer
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: bitnami/kubectl:latest
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: host-aws-creds
                  mountPath: /host-aws
                  readOnly: true
              command:
                - sh
                - -c
                - |
                  set -eu
                  kubectl create secret generic aws-ambient-credentials \
                    -n cert-manager \
                    --from-file=credentials=/host-aws/credentials \
                    --dry-run=client -o yaml | kubectl apply -f -
          volumes:
            - name: host-aws-creds
              hostPath:
                path: /root/.aws
                type: Directory
