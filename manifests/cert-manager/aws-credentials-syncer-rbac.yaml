# aws-credentials-sync-cronjob.ymlが使うServiceAccount。
# createはK8s RBACの仕様上resourceNamesで絞れないため、cert-manager
# namespace内であれば任意の名前のSecretを新規作成できてしまう点に注意
# (get/updateはaws-ambient-credentialsのみに制限)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-credentials-syncer
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-credentials-syncer
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["aws-ambient-credentials"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-credentials-syncer
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: aws-credentials-syncer
    namespace: cert-manager
roleRef:
  kind: Role
  name: aws-credentials-syncer
  apiGroup: rbac.authorization.k8s.io
