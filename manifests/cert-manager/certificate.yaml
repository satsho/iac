apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-focus4-net
  namespace: default
spec:
  secretName: keycloak-focus4-net-tls
  dnsNames:
    - keycloak.focus4.net
    - demo.focus4.net
    - hermes.focus4.net
  issuerRef:
    name: letsencrypt-route53
    kind: ClusterIssuer
