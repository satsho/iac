# Route53認証はambient credentials方式(SSM Hybrid Activation由来の一時
# クレデンシャル)に移行済み。accessKeyID/secretAccessKeySecretRefをあえて
# 書かないことで、cert-managerはAWS SDK標準の認証チェーン(環境変数/
# 共有クレデンシャルファイル)にフォールバックする。ClusterIssuerはデフォルトで
# ambient credentialsが有効(Issuerだと--issuer-ambient-credentials=trueが
# 別途必要)。
#
# 実際にファイルを供給する仕組みは aws-credentials-sync-cronjob.yaml と、
# 手動で一度だけ当てるcert-manager Deploymentへのパッチ(README参照)。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-route53
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "emeth.meth0307@gmail.com"
    privateKeySecretRef:
      name: letsencrypt-route53-account-key
    solvers:
      - dns01:
          route53:
            region: ap-northeast-1
