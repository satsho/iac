# CowrieのJSON構造化ログ(cowrie.json)をtailして、1行ずつhoneypot_eventsに
# INSERTするだけの小さなスクリプト。GeoIP(国名解決)はここでは行わない
# (このPodのegressはPostgres+DNSのみに絞っているため、外部APIを呼べない。
# 国名は後で別のバッチ処理でsrc_ipから解決してUPDATEする想定)。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cowrie-log-shipper
  namespace: honeypot
data:
  ship.py: |
    import json
    import os
    import time

    import psycopg2

    LOG_PATH = os.environ.get("LOG_PATH", "/cowrie-logs/cowrie.json")

    conn = psycopg2.connect(
        host=os.environ["PGHOST"],
        port=os.environ.get("PGPORT", "5432"),
        dbname=os.environ["PGDATABASE"],
        user=os.environ["PGUSER"],
        password=os.environ["PGPASSWORD"],
    )
    conn.autocommit = True
    cur = conn.cursor()

    print(f"waiting for {LOG_PATH} ...", flush=True)
    while not os.path.exists(LOG_PATH):
        time.sleep(2)

    with open(LOG_PATH, "r") as f:
        # 再起動時に過去分を読み直さないよう、ファイル末尾から追跡する
        f.seek(0, os.SEEK_END)
        print("tailing cowrie.json", flush=True)
        while True:
            line = f.readline()
            if not line:
                time.sleep(1)
                continue
            line = line.strip()
            if not line:
                continue
            try:
                event = json.loads(line)
            except json.JSONDecodeError:
                print(f"skip malformed line: {line[:200]}", flush=True)
                continue

            try:
                # cowrieのtimestampはISO8601文字列("2024-01-01T12:00:00.000000Z")
                # なので、そのままtimestamptzにキャストさせる(to_timestamp不要)。
                cur.execute(
                    """
                    INSERT INTO honeypot_events
                        (event_time, src_ip, session_id, event_type,
                         username, password, command, raw_event)
                    VALUES (COALESCE(%s::timestamptz, now()), %s, %s, %s, %s, %s, %s, %s)
                    """,
                    (
                        event.get("timestamp"),
                        event.get("src_ip"),
                        event.get("session"),
                        event.get("eventid"),
                        event.get("username"),
                        event.get("password"),
                        event.get("input"),
                        json.dumps(event),
                    ),
                )
            except Exception as exc:
                print(f"insert failed: {exc}", flush=True)
                conn.rollback()
