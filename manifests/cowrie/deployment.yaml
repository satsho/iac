# Cowrie本体(SSHハニーポット)+ ログをPostgresに流すサイドカー。
#
# securityContext: 攻撃者と直接対峙するcowrieコンテナだけ非root・読み取り専用
# ルートFS・capability全剥奪にする(cowrie公式イメージはもともと非rootで動く
# 設計)。log-shipperはpython:3.12-slim(デフォルトroot実行、USER指定なし)を
# 使っていてpip installもするため、Pod全体には runAsNonRoot を強制しない
# (コンテナごとに個別設定する)。log-shipperはPostgres+DNS以外にegressできない
# NetworkPolicyで隔離されているので、root実行のリスクは許容する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowrie
  namespace: honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cowrie
  template:
    metadata:
      labels:
        app: cowrie
    spec:
      containers:
        - name: cowrie
          image: cowrie/cowrie:latest
          env:
            - name: COWRIE_OUTPUT_JSONLOG_ENABLED
              value: "true"
            - name: COWRIE_HONEYPOT_HOSTNAME
              value: honeypot
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # cowrieのvarディレクトリ(ログ・ダウンロードファイル置き場)は
            # 書き込みが必要なので、ここだけemptyDirでマウントする。
            # 実際のログパスはcowrieのバージョンにより異なる場合があるため、
            # 初回デプロイ後に`kubectl exec -n honeypot deploy/cowrie -c cowrie -- /bin/ls -la /cowrie/cowrie-git/var/log/cowrie/`
            # で確認し、ズレていればLOG_PATHと合わせて調整すること
            # (PATHにcowrieのvenv binしか無く`ls`/`find`が素のコマンド名では
            # 見つからないため、絶対パス指定で呼び出す)。
            - name: cowrie-var
              mountPath: /cowrie/cowrie-git/var
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {memory: "512Mi"}
        - name: log-shipper
          image: python:3.12-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir --quiet psycopg2-binary && python /scripts/ship.py
          env:
            - name: LOG_PATH
              value: /cowrie-logs/cowrie.json
            - name: PGHOST
              value: honeypot-postgres
            - name: PGDATABASE
              value: honeypot
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: honeypot-postgres-secrets, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: honeypot-postgres-secrets, key: password}
          volumeMounts:
            - name: cowrie-var
              mountPath: /cowrie-logs
              subPath: log/cowrie
              readOnly: true
            - name: shipper-script
              mountPath: /scripts
          securityContext:
            readOnlyRootFilesystem: false # pip installのため
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {memory: "256Mi"}
      volumes:
        - name: cowrie-var
          emptyDir: {}
        - name: shipper-script
          configMap:
            name: cowrie-log-shipper
