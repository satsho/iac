# log-shipperが必要とするpsycopg2-binaryを、一度だけインストールしてPVCに
# 保存するJob。ArgoCDのhookにはしない(PreSyncフックにした結果、PVC側が
# pruneで消される事故が起きたため、普通に追跡される一回限りのJobとして
# 扱う)。このJobは二度と再実行されない(spec変更時は手動で
# `kubectl delete job cowrie-pip-install -n honeypot`してから再同期する)。
#
# このPodは`app: cowrie`ラベルを持たないため、networkpolicy.yamlの
# Egress制限(podSelector: app=cowrie)の対象外 = 通常通りインターネットに
# 出られる。これにより、常時起動しているlog-shipperサイドカー自体は
# 一切インターネットへ出る必要が無いまま(Postgres+DNSのみ)に保てる。
apiVersion: batch/v1
kind: Job
metadata:
  name: cowrie-pip-install
  namespace: honeypot
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: cowrie-pip-install
    spec:
      restartPolicy: Never
      containers:
        - name: pip-install
          image: python:3.12-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir --target=/pip-packages psycopg2-binary
          volumeMounts:
            - name: pip-cache
              mountPath: /pip-packages
      volumes:
        - name: pip-cache
          persistentVolumeClaim:
            claimName: cowrie-pip-cache
