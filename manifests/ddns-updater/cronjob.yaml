# 自宅のグローバルIPは固定ではないため、定期的に実際のIPを検知してRoute53の
# honeypot.focus4.netレコードを直接UPSERTする想定で作ったが、自宅のISP
# (NURO)がCGNATでIPv4を複数契約者と共有しており、そもそも自宅のグローバルIP
# 宛にルーターのポート転送ができないことが判明。ハニーポットの公開は
# Tailscale Funnel経由(honeypot_funnel、CNAME)に変更したため、このCronJob
# は今は使い道が無い。削除はせず、将来「自分専用の固定IPv4が使えるようになった」
# 等の場合に備えてsuspendで休止している。
#
# 認証はSSM Hybrid Activationの一時クレデンシャル(/root/.aws/credentials、
# ホスト上でSSM Agentが自動更新)をそのままhostPathでマウントして使う
# (hermes-agent/backup-cronjob.yamlと同じパターン)。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ddns-updater
  namespace: ddns
spec:
  suspend: true
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            # amazon/aws-cliイメージにcurlが入っているか確証が無いため、
            # IP検知だけ別の実績あるイメージに切り出す。
            - name: detect-ip
              image: curlimages/curl:8.10.1
              command:
                - sh
                - -c
                - curl -sS https://checkip.amazonaws.com | tr -d '[:space:]' > /ip-data/current_ip
              volumeMounts:
                - name: ip-data
                  mountPath: /ip-data
          containers:
            - name: update-route53
              image: amazon/aws-cli:2.27.0
              env:
                - name: AWS_SHARED_CREDENTIALS_FILE
                  value: /host-aws/credentials
                - name: AWS_REGION
                  value: ap-northeast-1
                # dns.tfのimportブロックと同じ既存ホストゾーンID。
                - name: HOSTED_ZONE_ID
                  value: Z00444252EVDC2QR0ELW1
                - name: RECORD_NAME
                  value: honeypot.focus4.net
              volumeMounts:
                - name: ip-data
                  mountPath: /ip-data
                  readOnly: true
                - name: host-aws-creds
                  mountPath: /host-aws
                  readOnly: true
              command:
                - sh
                - -c
                - |
                  set -eu
                  CURRENT_IP=$(cat /ip-data/current_ip)
                  if [ -z "$CURRENT_IP" ]; then
                    echo "failed to detect public IP" >&2
                    exit 1
                  fi

                  EXISTING_IP=$(aws route53 list-resource-record-sets \
                    --hosted-zone-id "$HOSTED_ZONE_ID" \
                    --query "ResourceRecordSets[?Name=='${RECORD_NAME}.' && Type=='A'].ResourceRecords[0].Value" \
                    --output text)

                  if [ "$CURRENT_IP" = "$EXISTING_IP" ]; then
                    echo "IP unchanged (${CURRENT_IP}), nothing to do"
                    exit 0
                  fi

                  echo "IP changed: ${EXISTING_IP:-<none>} -> ${CURRENT_IP}, updating Route53"
                  cat > /tmp/change-batch.json <<EOF
                  {
                    "Changes": [{
                      "Action": "UPSERT",
                      "ResourceRecordSet": {
                        "Name": "${RECORD_NAME}",
                        "Type": "A",
                        "TTL": 300,
                        "ResourceRecords": [{"Value": "${CURRENT_IP}"}]
                      }
                    }]
                  }
                  EOF
                  aws route53 change-resource-record-sets \
                    --hosted-zone-id "$HOSTED_ZONE_ID" \
                    --change-batch file:///tmp/change-batch.json
          volumes:
            - name: ip-data
              emptyDir: {}
            - name: host-aws-creds
              hostPath:
                path: /root/.aws
                type: Directory
