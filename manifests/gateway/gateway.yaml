# portはk3s標準Traefikの"web"エントリーポイントの実ポート(コンテナ内部の8000番)を
# 指定する。80番はService側で8000番に変換された後の外部公開ポートなので、
# ここに書いてもTraefikのGateway APIプロバイダはエントリーポイントを見つけられない
# ("Cannot find entryPoint for Gateway: no matching entryPoint for port 80")。
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      # デフォルト(Same)だとGatewayと同じnamespace(default)のHTTPRouteしか
      # 紐付けられない。keycloak namespaceのHTTPRouteも使うためAllにする。
      allowedRoutes:
        namespaces:
          from: All
    # websecureエントリーポイントの実ポート(コンテナ内部の8443番、"web"と同じ
    # +8000オフセットの命名規則)。cert-managerが発行したSecretをTLS終端に使う。
    - name: websecure
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: keycloak-focus4-net-tls
      allowedRoutes:
        namespaces:
          from: All
