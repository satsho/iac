# demo.focus4.netはoauth2-proxy(Google/Keycloak認証)を経由させ、
# demo-nginxには直接届かせない(manifests/oauth2-proxy参照)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-nginx
  namespace: default
spec:
  hostnames:
    - demo.focus4.net
  parentRefs:
    - name: traefik-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy
          port: 4180
