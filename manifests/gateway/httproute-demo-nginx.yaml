# 動作確認用。demo-nginx(manifests/demo-nginx、Service port 80)への
# パスベースルーティングをGateway API経由で試す。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-nginx
  namespace: default
spec:
  hostnames:
    - demo.focus4.net
  parentRefs:
    - name: traefik-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-nginx
          port: 80
