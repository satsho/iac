# hermes.focus4.netはoauth2-proxy-hermes(Google/Keycloak認証)を経由させ、
# hermes-agentには直接届かせない(manifests/oauth2-proxy-hermes参照)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  namespace: hermes
spec:
  hostnames:
    - hermes.focus4.net
  parentRefs:
    - name: traefik-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy-hermes
          port: 4180
