# keycloak.focus4.netのホスト名を丸ごとKeycloakに割り当てる(ルート/でログイン画面へ)。
# パスプレフィックスは使わない(Keycloak側もKC_HTTP_RELATIVE_PATHを設定しない、
# manifests/keycloak/deployment.yaml参照)。
# HTTPRoute自体はkeycloak Serviceと同じnamespaceに置く(ReferenceGrant不要)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hostnames:
    - keycloak.focus4.net
  parentRefs:
    - name: traefik-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
