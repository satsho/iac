# 第1段階: NodePortでTailscale経由のみアクセス可能にする
# (http://<Tailscale IP>:30119 でダッシュボードに到達できる)。
# 外部公開する際はこのNodePortをやめてGateway API経由に切り替える。
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes
spec:
  type: NodePort
  selector:
    app: hermes-agent
  ports:
    - name: dashboard
      port: 9119
      targetPort: 9119
      nodePort: 30119
