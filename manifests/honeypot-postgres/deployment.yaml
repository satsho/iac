# ハニーポット専用のPostgres。他のサービス(hermes/keycloak等)とは別namespace
# (honeypot)に置き、NetworkPolicy(manifests/cowrie/networkpolicy.yaml)で
# Cowrieコンテナからのみ到達できるようにする。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeypot-postgres
  namespace: honeypot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honeypot-postgres
  template:
    metadata:
      labels:
        app: honeypot-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: honeypot
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: honeypot-postgres-secrets, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: honeypot-postgres-secrets, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            # execプローブのcommandは$(VAR)展開されない(container自体のcommand/args
            # とは違う)ため、sh -cで包んで実シェル変数として展開させる。
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d honeypot"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {memory: "1Gi"}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: honeypot-postgres-data
        - name: init-scripts
          configMap:
            name: honeypot-postgres-init
