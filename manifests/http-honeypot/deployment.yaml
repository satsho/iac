# 自作のHTTPハニーポット本体。python:3.12-slim + 標準ライブラリのHTTPサーバ
# のみで動く単一コンテナ(Cowrieのようなログファイルtail用サイドカーは不要。
# リクエストごとに直接Postgresへ書き込む)。
#
# psycopg2-binaryはjob-pip-install.yamlが事前にPVCへインストール済みのものを
# PYTHONPATH経由で読むだけで、このコンテナ自身はインターネットへ出ない
# (NetworkPolicyでも出られない)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-honeypot
  namespace: honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-honeypot
  template:
    metadata:
      labels:
        app: http-honeypot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: honeypot
          image: python:3.12-slim
          command:
            - python
            - /app/app.py
          env:
            - name: PYTHONPATH
              value: /pip-packages
            - name: PGHOST
              value: honeypot-postgres
            - name: PGDATABASE
              value: honeypot
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: honeypot-postgres-secrets, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: honeypot-postgres-secrets, key: password}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-script
              mountPath: /app
              readOnly: true
            - name: pip-cache
              mountPath: /pip-packages
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "50m", memory: "128Mi"}
            limits: {memory: "256Mi"}
      volumes:
        - name: app-script
          configMap:
            name: http-honeypot-app
        - name: pip-cache
          persistentVolumeClaim:
            claimName: http-honeypot-pip-cache
        - name: tmp
          emptyDir: {}
