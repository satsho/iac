# honeypotコンテナが必要とするpsycopg2-binaryを、一度だけインストールして
# PVCに保存するJob。このPodは`app: http-honeypot`ラベルを持たないため、
# networkpolicy.yamlのEgress制限の対象外 = 通常通りインターネットに出られる。
# これにより、常時起動しているhoneypotコンテナ自体は一切インターネットへ
# 出る必要が無いまま(Postgres+DNSのみ)に保てる。
#
# ArgoCDのhookにはしない(普通のJobとして追跡。一度実行されたら再実行されない。
# pip installの内容を変える場合は`kubectl delete job http-honeypot-pip-install
# -n honeypot`で手動削除してから再同期すること)。
apiVersion: batch/v1
kind: Job
metadata:
  name: http-honeypot-pip-install
  namespace: honeypot
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: http-honeypot-pip-install
    spec:
      restartPolicy: Never
      containers:
        - name: pip-install
          image: python:3.12-slim
          command:
            - sh
            - -c
            - pip install --no-cache-dir --target=/pip-packages psycopg2-binary
          volumeMounts:
            - name: pip-cache
              mountPath: /pip-packages
      volumes:
        - name: pip-cache
          persistentVolumeClaim:
            claimName: http-honeypot-pip-cache
