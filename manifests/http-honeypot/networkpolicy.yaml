# Cowrieの時と同じ隔離方針。Ingressは攻撃者を受け入れるため無制限、
# Egressは同namespace内のPostgres+DNSのみ許可する。侵害された場合に他の
# namespace(hermes/keycloak等)へ横移動されないようにするのが目的。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-honeypot-egress-lockdown
  namespace: honeypot
spec:
  podSelector:
    matchLabels:
      app: http-honeypot
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: honeypot-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
