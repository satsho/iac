# honeypotコンテナが使うpsycopg2-binaryの保存先。cowrieで学んだ教訓により、
# ArgoCDのhookにはしない(hookは一時リソース扱いされ、prune時に稼働中でも
# 削除される事故が起きたため)。honeypot-postgres-dataと同じ普通のPVC。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: http-honeypot-pip-cache
  namespace: honeypot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi
