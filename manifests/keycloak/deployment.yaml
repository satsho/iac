# 認証情報(keycloak-adminシークレット)はGitOpsの管理対象外にしている
# (パスワードを公開リポジトリにコミットしたくないため)。事前にkubectlで
# 直接作成しておくこと:
#   kubectl create namespace keycloak
#   kubectl create secret generic keycloak-admin -n keycloak \
#     --from-literal=username=admin --from-literal=password='<任意のパスワード>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
