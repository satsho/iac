# 認証情報(keycloak-adminシークレット)はGitOpsの管理対象外にしている
# (パスワードを公開リポジトリにコミットしたくないため)。事前にkubectlで
# 直接作成しておくこと:
#   kubectl create namespace keycloak
#   kubectl create secret generic keycloak-admin -n keycloak \
#     --from-literal=username=admin --from-literal=password='<任意のパスワード>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # keycloak.focus4.netのルート("/")をそのまま使うのでパスプレフィックスは
            # 設定しない(manifests/gateway/httproute-keycloak.yaml参照)。
            # TraefikがTLSを終端し内部へは平文HTTPで転送するため、外部から見た
            # スキーム/ホスト名をX-Forwarded-*ヘッダーから正しく認識させる。
            # これがないとAdmin ConsoleのURL生成がずれて画面が真っ白/エラーになる。
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HOSTNAME
              value: keycloak.focus4.net
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
