# ALBには繋いでおらず、Tailscale経由でこのポートに直接アクセスする
# (http://<ノードのTailscale IP>:30090/)。nodePortの値を変える場合は
# ここだけ変更すればよい(Terraform側からは参照していない)。
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
