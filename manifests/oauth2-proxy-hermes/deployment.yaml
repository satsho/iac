# Google認証(Keycloakのhome realm経由)でHermes Agentダッシュボードを保護する。
# oauth2-proxy自体がリバースプロキシとして振る舞い、未認証アクセスはKeycloak(→Google)の
# ログインへリダイレクトし、認証済みリクエストのみHermes Agentへ転送する。
# HTTPRoute(manifests/gateway/httproute-hermes.yaml)はhermes-agentではなく
# このoauth2-proxyをbackendRefにしている。
#
# Hermes Agent自身も0.0.0.0バインド時はBasic認証が必須な仕様なので、
# ここを通過した後にもう一段Hermes自身のBasic認証が出る(意図した多層防御)。
#
# client-secret/cookie-secretはGitOps管理外。事前にkubectlで作成しておくこと:
#   kubectl create secret generic oauth2-proxy-hermes-secrets -n hermes \
#     --from-literal=client-secret='<Keycloakのoauth2-proxy-hermesクライアントのClient secret>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32 | tr '+/' '-_')"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-hermes
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy-hermes
  template:
    metadata:
      labels:
        app: oauth2-proxy-hermes
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --http-address=0.0.0.0:4180
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://keycloak.focus4.net/realms/home
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://hermes.focus4.net/oauth2/callback
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://hermes-agent.hermes.svc.cluster.local:9119
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_CLIENT_ID
              value: oauth2-proxy-hermes
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-hermes-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-hermes-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
