# Google認証(Keycloakのhome realm経由)でdemo-nginxを保護する。
# oauth2-proxy自体がリバースプロキシとして振る舞い、未認証アクセスはKeycloak(→Google)の
# ログインへリダイレクトし、認証済みリクエストのみdemo-nginxへ転送する。
# HTTPRoute(manifests/gateway/httproute-demo-nginx.yaml)はdemo-nginxではなく
# このoauth2-proxyをbackendRefにしている。
#
# client-secret/cookie-secretはGitOps管理外。事前にkubectlで作成しておくこと:
#   kubectl create secret generic oauth2-proxy-secrets -n default \
#     --from-literal=client-secret='<Keycloakのoauth2-proxyクライアントのClient secret>' \
#     --from-literal=cookie-secret="$(openssl rand -base64 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          args:
            - --http-address=0.0.0.0:4180
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://keycloak.focus4.net/realms/home
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://demo.focus4.net/oauth2/callback
            - name: OAUTH2_PROXY_UPSTREAMS
              value: http://demo-nginx.default.svc.cluster.local:80
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            # KeycloakがGoogleをブローカーした際にemail_verifiedをtrueで
            # 引き継がないことがあり、デフォルトだとoauth2-proxyがid_tokenを
            # 拒否してしまう(Googleアカウント自体のメールは当然検証済み)。
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            # TraefikがTLSを終端し内部へは平文HTTPで転送するため、外部から見た
            # スキーム/ホスト名をX-Forwarded-*ヘッダーから正しく認識させる。
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "true"
            - name: OAUTH2_PROXY_CLIENT_ID
              value: oauth2-proxy
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secrets
                  key: cookie-secret
          ports:
            - containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
