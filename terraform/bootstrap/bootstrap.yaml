AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstrap stack that creates the S3 bucket for Terraform state (satsho/iac).
  No DynamoDB lock table is used (relies on Terraform 1.10+ native S3 locking).

Parameters:
  BucketName:
    Type: String
    Default: satsho-iac-tfstate
    Description: S3 bucket name for storing tfstate (must be globally unique)

Resources:
  TerraformStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub '${TerraformStateBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  BucketName:
    Description: Value to set as 'bucket' in environments/dev/backend.tf
    Value: !Ref TerraformStateBucket
  BucketArn:
    Description: For verifying the Resource in terraform/iam/terraform-role.yaml
    Value: !GetAtt TerraformStateBucket.Arn
