AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM role that GitHub Actions (OIDC) assumes when running Terraform.
  The trust policy allows execution only from the specified Environment
  (a job that sets environment:), and the permission policy is limited to
  VPC operations plus access to the tfstate S3 bucket.

Parameters:
  RoleName:
    Type: String
    Default: github-actions-terraform

  OIDCProviderArn:
    Type: String
    Default: arn:aws:iam::563613886922:oidc-provider/token.actions.githubusercontent.com
    Description: ARN of the already-created OIDC provider for GitHub Actions

  GitHubOwner:
    Type: String
    Default: satsho

  GitHubOwnerId:
    Type: String
    Default: '15127328'
    Description: owner_id used in the immutable subject format (already obtained from the sub claim)

  GitHubRepo:
    Type: String
    Default: iac

  GitHubRepoId:
    Type: String
    Default: '1371692263'
    Description: repo_id used in the immutable subject format (already obtained from the sub claim)

  GitHubEnvironment:
    Type: String
    Default: AWS
    Description: Name of the GitHub Actions Environment allowed to apply (when a job sets environment:, the sub claim is based on the environment instead of the ref)

  TFStateBucketName:
    Type: String
    Default: satsho-iac-tfstate
    Description: S3 bucket name for tfstate, created by bootstrap.yaml

  AwsRegion:
    Type: String
    Default: ap-northeast-1

Resources:
  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProviderArn
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: terraform-vpc-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2Broad
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AwsRegion
              - Sid: TerraformStateS3
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${TFStateBucketName}/dev/*'
              - Sid: TerraformStateS3List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${TFStateBucketName}'
              - Sid: InstanceIamManage
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                  - iam:ListInstanceProfilesForRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/iac-poc-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/iac-poc-*'
              - Sid: InstancePassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/iac-poc-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com

Outputs:
  RoleArn:
    Description: Value to set as AWS_ROLE_ARN in GitHub Variables
    Value: !GetAtt TerraformRole.Arn
