AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions (OIDC) が Terraform 実行時にAssumeするIAMロール。
  信頼ポリシーは指定Environment(ジョブに environment: を指定した実行)からの実行のみ許可し、
  権限ポリシーはVPC操作+tfstate用S3バケットへのアクセスのみに限定する。

Parameters:
  RoleName:
    Type: String
    Default: github-actions-terraform

  OIDCProviderArn:
    Type: String
    Default: arn:aws:iam::563613886922:oidc-provider/token.actions.githubusercontent.com
    Description: すでに作成済みのGitHub Actions用OIDCプロバイダーのARN

  GitHubOwner:
    Type: String
    Default: satsho

  GitHubOwnerId:
    Type: String
    Default: '15127328'
    Description: 不変サブジェクト形式で使われるowner_id(sub claimから取得済みの値)

  GitHubRepo:
    Type: String
    Default: iac

  GitHubRepoId:
    Type: String
    Default: '1371692263'
    Description: 不変サブジェクト形式で使われるrepo_id(sub claimから取得済みの値)

  GitHubEnvironment:
    Type: String
    Default: AWS
    Description: apply権限を許可するGitHub Actions Environment名(ジョブがenvironmentを指定する場合、subはref基準ではなくenvironment基準になる)

  TFStateBucketName:
    Type: String
    Default: satsho-iac-tfstate
    Description: bootstrap.yaml で作成したtfstate用S3バケット名

  AwsRegion:
    Type: String
    Default: ap-northeast-1

Resources:
  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProviderArn
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: terraform-vpc-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2Broad
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AwsRegion
              - Sid: TerraformStateS3
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${TFStateBucketName}/dev/*'
              - Sid: TerraformStateS3List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${TFStateBucketName}'
              - Sid: InstanceIamManage
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                  - iam:TagInstanceProfile
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/iac-poc-*'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:instance-profile/iac-poc-*'
              - Sid: InstancePassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/iac-poc-*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com

Outputs:
  RoleArn:
    Description: GitHub VariablesのAWS_ROLE_ARNに設定する値
    Value: !GetAtt TerraformRole.Arn
