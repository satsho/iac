AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM role that GitHub Actions (OIDC) assumes when running Terraform.
  The trust policy allows execution only from the specified Environment
  (a job that sets environment:). This is a trial/learning environment,
  so the permission policy is intentionally broad for EC2, IAM and
  CloudFormation; only the tfstate S3 bucket access stays scoped.

Parameters:
  RoleName:
    Type: String
    Default: github-actions-terraform

  OIDCProviderArn:
    Type: String
    Default: arn:aws:iam::563613886922:oidc-provider/token.actions.githubusercontent.com
    Description: ARN of the already-created OIDC provider for GitHub Actions

  GitHubOwner:
    Type: String
    Default: satsho

  GitHubOwnerId:
    Type: String
    Default: '15127328'
    Description: owner_id used in the immutable subject format (already obtained from the sub claim)

  GitHubRepo:
    Type: String
    Default: iac

  GitHubRepoId:
    Type: String
    Default: '1371692263'
    Description: repo_id used in the immutable subject format (already obtained from the sub claim)

  GitHubEnvironment:
    Type: String
    Default: AWS
    Description: Name of the GitHub Actions Environment allowed to apply (when a job sets environment:, the sub claim is based on the environment instead of the ref)

  TFStateBucketName:
    Type: String
    Default: satsho-iac-tfstate
    Description: S3 bucket name for tfstate, created by bootstrap.yaml

  AwsRegion:
    Type: String
    Default: ap-northeast-1

Resources:
  TerraformRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProviderArn
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: terraform-vpc-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2Broad
                Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AwsRegion
              # dev/dnsなど複数stateキーをこのバケット配下で使うため、
              # devプレフィックス限定ではなくバケット全体に許可する。
              - Sid: TerraformStateS3
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${TFStateBucketName}/*'
              - Sid: TerraformStateS3List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::${TFStateBucketName}'
              # トライアル段階のため、IAM/CloudFormationはリソース種別単位で
              # 広く許可する(iac-poc-*やロール名限定での個別許可は、必要な
              # アクションを一つずつ後から足す往復が多く非効率だったため撤廃)。
              # S3(tfstate)だけは元々バケット限定で困っていないため維持。
              - Sid: IamBroad
                Effect: Allow
                Action:
                  - iam:*
                Resource: '*'
              - Sid: CloudFormationBroad
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Sid: Route53Broad
                Effect: Allow
                Action:
                  - route53:*
                Resource: '*'

Outputs:
  RoleArn:
    Description: Value to set as AWS_ROLE_ARN in GitHub Variables
    Value: !GetAtt TerraformRole.Arn
